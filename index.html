<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-JEJU CHICKEN · Thành viên · 멤버십</title>
<meta name="theme-color" content="#EE6A1F">
<style>
html,body{margin:0;height:100%;background:#FFF6EE}
iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" title="K-JEJU CHICKEN thành viên" allow="clipboard-write"></iframe>
<script>
// Chuyển số bàn từ QR (?khach-hang-ban=7) vào app Google Apps Script
var u = "https://script.google.com/macros/s/AKfycbwq8eH1fAvSNlqUPyjzyKo5d9ZEqbCH57xz-We2tSuqhN2sRdP1IxQ80zS4oHEXaVkZ/exec?mode=tra";
var q = new URLSearchParams(location.search);
var ban = parseInt(q.get("khach-hang-ban") || q.get("ban"), 10);
if (ban >= 1 && ban <= 25) {
  u += "&ban=" + ban;
  document.title = "Khách hàng bàn " + ban + " · K-JEJU CHICKEN";
}
document.getElementById("app").src = u;
</script>
</body>
</html>
